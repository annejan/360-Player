<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<title>360 minimalist</title>
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
		<meta name="theme-color" content="#000000">
		<meta name="mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-capable" content="yes">
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
		<style>
			html, body {
				height: 100%;
				margin: 0;
				padding: 0;
				overflow: hidden;
				background: #000;
				color: #fff;
				font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, sans-serif;
				overscroll-behavior: none;
			}
			#container {
				position: fixed;
				inset: 0;
				touch-action: none;
				cursor: grab;
			}
			#container:active { cursor: grabbing; }
			canvas { display: block; }
			img, video { display: none; }
			#ui {
				position: fixed;
				inset: 0;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 12px;
				pointer-events: none;
			}
			#ui button {
				pointer-events: auto;
				min-width: 160px;
				padding: 12px 20px;
				border: 1px solid rgba(255, 255, 255, 0.6);
				border-radius: 999px;
				background: rgba(0, 0, 0, 0.55);
				color: #fff;
				font: inherit;
				cursor: pointer;
				backdrop-filter: blur(6px);
			}
			#ui button:hover, #ui button:focus-visible { background: rgba(255, 255, 255, 0.2); outline: none; }
			#ui button[hidden] { display: none; }
			#status {
				position: fixed;
				left: 0;
				right: 0;
				bottom: env(safe-area-inset-bottom, 0);
				padding: 8px 12px;
				font-size: 13px;
				text-align: center;
				color: rgba(255, 255, 255, 0.7);
				pointer-events: none;
			}
			#status:empty { display: none; }
		</style>
		<script type="importmap">
			{
				"imports": {
					"three": "./vendor/three/three.module.js",
					"three/addons/": "./vendor/three/addons/"
				}
			}
		</script>
	</head>
	<body>
		<div id="container"></div>
		<div id="ui">
			<button id="play" type="button">Play</button>
			<button id="motion" type="button" hidden>Enable motion control</button>
			<button id="fullscreen" type="button">Fullscreen</button>
			<button id="vr" type="button">Cardboard (side by side)</button>
		</div>
		<div id="status"></div>

		<img id="img" alt="360 image">
		<video id="video" loop playsinline preload="auto" crossorigin="anonymous"></video>

		<script type="module" src="panorama.js"></script>
	</body>
</html>
